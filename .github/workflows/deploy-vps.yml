name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull · migrate · rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            if [ ! -d /opt/ViraChat/.git ]; then
              echo "Repo ainda não clonado em /opt/ViraChat — rode o setup inicial (DEPLOY-VPS.md)."
              exit 1
            fi
            # Garante script atualizado antes do reset completo do deploy.sh
            cd /opt/ViraChat
            git fetch origin main
            git reset --hard origin/main
            bash /opt/ViraChat/docker/scripts/deploy.sh
