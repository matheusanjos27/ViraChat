# Deploy VPS — DESLIGADO por enquanto (deploy manual na VPS).
# Para reativar: descomente o bloco `on` abaixo e apague o `workflow_dispatch` dummy,
# ou restaure o histórico deste arquivo.
#
# Manual:
#   cd /opt/ViraChat && git pull
#   cd docker && docker compose -f docker-compose.prod.yml up -d --build virachat
#   # ou: bash /opt/ViraChat/docker/scripts/deploy.sh

name: Deploy VPS (disabled)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite ENABLE para permitir (workflow desativado — use deploy manual)"
        required: true
        default: ""

jobs:
  skipped:
    name: Disabled — use deploy manual
    runs-on: ubuntu-latest
    steps:
      - name: Stop
        run: |
          echo "Deploy via Actions está desligado. Use a VPS na mão:"
          echo "  cd /opt/ViraChat && git pull"
          echo "  cd docker && docker compose -f docker-compose.prod.yml up -d --build virachat"
          exit 1
