# ViraChat em produção — tudo numa VPS (app + Evolution)
# Uso (na pasta docker/):
#   cp .env.prod.example .env
#   # edite .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Supabase self-host: ver DEPLOY-VPS.md (stack oficial ao lado deste compose)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      APP_ALIAS: ${APP_ALIAS:-localhost}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-localhost}
      WA_DOMAIN: ${WA_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-localhost}
      SUPABASE_KONG_UPSTREAM: ${SUPABASE_KONG_UPSTREAM:-supabase-envoy:8000}
    depends_on:
      - virachat
      - evolution-api

  virachat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EVOLUTION_API_URL: http://evolution-api:8080
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      # Disco do host (VPS) p/ painel de saúde — só leitura
      - /:/host:ro
    depends_on:
      evolution-api:
        condition: service_started
    expose:
      - "3000"

  evolution-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_TYPE: apikey
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_vira
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      CONFIG_SESSION_PHONE_CLIENT: ViraChat
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - evolution_instances:/evolution/instances
    expose:
      - "8080"

volumes:
  caddy_data:
  caddy_config:
  evolution_pg:
  evolution_redis:
  evolution_instances:
